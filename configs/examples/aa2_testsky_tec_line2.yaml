# AA2 1 h test with the simple 5-source test sky and a "line2" TEC screen
# (~10 MHz bandwidth: 250 x 43.4 kHz channels).
run:
  identifier: _testsky2_tec_line2
observation:
  array: AA2
  nhours: 1
  time_step_s: 6.8
  start_freq_mhz: 120.0
  freq_step_khz: 43.4
  nchan: 250
  nsubbands: 1
  pol_mode: Full
simulator:
  ionosphere:
    tec_screen: blank_line2_iono.fits   # alternatives used: scan_0.fits, or null for none
sky:
  model: testsky
postprocess:
  average: false
imaging:
  npix: 4096
  channels_out: 2
  deconvolution_channels: 2
