# As aa2_cosmos_ionosphere.yaml, but with the COSMOS catalogue containing variable sources.
run:
  identifier: _cosmos_ion_var
observation:
  array: AA2
  nhours: 4
  time_step_s: 3.4
  start_freq_mhz: 120.0
  freq_step_khz: 21.7
  nchan: 6912
  nsubbands: 6
simulator:
  ionosphere:
    tec_screen: scan_0.fits
sky:
  model: COSMOS
  flux_limit_jy: 0
  cosmos:
    variable: true
postprocess:
  average: true
  avg_time_step: 4
  avg_freq_step: 4
imaging:
  channels_out: 12
  deconvolution_channels: 6
